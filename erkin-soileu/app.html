<title>Еркін сөйлеу әлемі</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: a calm "path" — preparation stepping-stones first, then six coloured islands of games; each game opens a focused one-task-at-a-time board. */
:root{
  --bg:#F1F6F4; --paper:#FFFFFF; --ink:#1E3338; --muted:#5B7076; --line:#D7E3E0;
  --sun:#F2B33D; --sun-ink:#5A3D00;
  --c1:#4E9FD6; --c2:#E5735B; --c3:#E3A21A; --c4:#3E9E73; --c5:#2A9A9C; --c6:#9A6BB5;
  --ok:#3E9E73; --soft:#FCEFD6;
  --shadow:0 2px 0 rgba(30,51,56,.08), 0 8px 24px -12px rgba(30,51,56,.25);
  --f-display:"Rubik", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12201F; --paper:#1A2B2B; --ink:#E7F1EE; --muted:#9DB3AF; --line:#2C4241;
  --sun:#F2B33D; --sun-ink:#2B1D00;
  --c1:#6DB4E6; --c2:#F08A73; --c3:#EDB33B; --c4:#5CBB8F; --c5:#4CB8B9; --c6:#B78CD0;
  --ok:#5CBB8F; --soft:#3A3120; --shadow:0 2px 0 rgba(0,0,0,.25), 0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12201F; --paper:#1A2B2B; --ink:#E7F1EE; --muted:#9DB3AF; --line:#2C4241;
  --sun:#F2B33D; --sun-ink:#2B1D00;
  --c1:#6DB4E6; --c2:#F08A73; --c3:#EDB33B; --c4:#5CBB8F; --c5:#4CB8B9; --c6:#B78CD0;
  --ok:#5CBB8F; --soft:#3A3120; --shadow:0 2px 0 rgba(0,0,0,.25), 0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand .dot{width:34px;height:34px;border-radius:50% 50% 50% 8px;background:var(--sun);display:grid;place-items:center;color:var(--sun-ink);font-weight:800;font-size:17px}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top nav a{text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.top nav a:hover,.top nav a.on{background:var(--paper);color:var(--ink)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding-block:28px 36px}
.hero h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.01em}
.hero h1 span{color:var(--c5)}
.hero p.lead{font-size:20px;max-width:34ch;margin:14px 0 22px;color:var(--muted)}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}
.facts div{font-family:var(--f-display)}
.facts b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.facts span{font-size:14px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:18px;text-decoration:none;background:var(--paper);box-shadow:var(--shadow)}
.btn.primary{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.letters{position:relative;aspect-ratio:1/0.85;max-width:100%}
.letters i{position:absolute;font-style:normal;font-family:var(--f-display);font-weight:800;display:grid;place-items:center;
  border-radius:48% 48% 48% 10px;color:#fff;box-shadow:var(--shadow);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* ---------- section titles ---------- */
.sec{padding-block:26px 8px}
.sec h2{font-size:clamp(26px,3.5vw,34px);font-weight:800}
.sec .sub{color:var(--muted);margin:6px 0 0;max-width:60ch}

/* prep path */
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:18px;counter-reset:st}
.stone{background:var(--paper);border-radius:20px;padding:16px;box-shadow:var(--shadow);text-decoration:none;display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.stone .n{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stone h3{font-size:19px}
.stone .ic{font-size:38px;line-height:1}
.stone ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.stars{display:flex;gap:2px;font-size:15px;letter-spacing:0}
.stars .s{opacity:.22;filter:grayscale(1)}
.stars .s.on{opacity:1;filter:none}

/* islands */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tab{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px}
.tab[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:#fff}
.island{margin-top:22px;border-radius:26px;padding:20px;background:color-mix(in srgb,var(--k) 12%,var(--paper));}
.island-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.island-h h3{font-size:22px}
.island-h .rng{font-family:var(--f-display);font-weight:800;color:var(--k)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.gcard{background:var(--paper);border-radius:18px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0;transition:transform .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard .num{font-family:var(--f-display);font-weight:800;color:var(--k);font-size:14px}
.gcard .ic{font-size:40px;line-height:1.1}
.gcard h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}

.note{background:var(--soft);border-radius:20px;padding:18px 20px;margin-top:26px}
.note h3{font-size:19px;margin-bottom:6px}
.note ul{margin:6px 0 0;padding-left:20px}

/* ---------- game board ---------- */
.board-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.back{border:0;background:var(--paper);border-radius:12px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow);text-decoration:none}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:#fff;background:var(--k)}
.board-h h1{font-size:clamp(24px,3.6vw,34px);font-weight:800;flex-basis:100%}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:6px 14px}
.lvl{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.lvl b{font-family:var(--f-display);font-size:16px}
.lvl small{color:var(--muted);font-weight:700;font-size:13px}
.lvl[aria-pressed="true"]{border-color:var(--k);background:color-mix(in srgb,var(--k) 14%,var(--paper))}
.lvl .done{float:right}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:16px;padding:12px 16px;border:2px dashed var(--line)}
.goal b{white-space:nowrap}
.dots{display:flex;gap:6px;margin:16px 0 8px}
.dots i{width:28px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--k)}
.dots i.cur{background:color-mix(in srgb,var(--k) 45%,var(--line))}
.task{background:var(--paper);border-radius:26px;padding:22px;box-shadow:var(--shadow);min-height:320px;display:flex;flex-direction:column;gap:16px}
.q{font-family:var(--f-display);font-size:clamp(20px,2.8vw,26px);font-weight:700;display:flex;gap:10px;align-items:flex-start}
.say{border:0;background:var(--bg);border-radius:12px;padding:6px 10px;font-size:18px;flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{border:3px solid var(--line);background:var(--paper);border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:16px;min-height:130px;justify-content:center;transition:transform .12s, border-color .2s}
.opt:hover{border-color:color-mix(in srgb,var(--k) 55%,var(--line))}
.opt .g{font-size:58px;line-height:1}
.opt.txt{min-height:72px;font-size:19px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.ok::after{content:"✓";color:var(--ok);font-size:20px}
.opt.no{animation:nudge .45s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{min-height:28px;font-weight:800;font-size:18px}
.msg.kind{color:var(--muted)}
.msg.good{color:var(--ok)}
.next{align-self:flex-end}
.bigpic{font-size:110px;line-height:1;text-align:center}
.cues{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cue{background:var(--bg);border-radius:20px;padding:14px 18px;font-size:56px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.cue small{font-size:14px;font-weight:800;color:var(--muted)}
.help{background:var(--bg);border-radius:16px;padding:12px 16px}
.help ul{margin:6px 0 0;padding-left:20px}
.tip{font-size:15px;color:var(--muted);display:flex;gap:8px}

/* breath */
.stage{position:relative;height:220px;border-radius:20px;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--c1) 22%,var(--paper)),var(--paper))}
.stage .actor{position:absolute;font-size:60px;line-height:1;transition:transform .08s linear;will-change:transform}
.stage .prop{position:absolute;font-size:44px;line-height:1}
.stage .waves{position:absolute;left:0;right:0;bottom:0;height:64px;background:color-mix(in srgb,var(--c1) 55%,var(--paper));border-radius:50% 50% 0 0/20px 20px 0 0}
.bub{position:absolute;border-radius:50%;border:2px solid color-mix(in srgb,var(--c1) 70%,#fff);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9),rgba(255,255,255,.1) 40%,color-mix(in srgb,var(--c6) 25%,transparent));animation:rise 3.2s ease-out forwards}
@keyframes rise{to{transform:translate(var(--dx),-210px);opacity:0}}
.flame{transition:transform .2s, opacity .4s;transform-origin:50% 100%}
.blowbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.blow{border:0;border-radius:22px;padding:18px 26px;font-size:20px;font-weight:800;background:var(--k);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow)}
.blow.on{transform:scale(.97);filter:brightness(1.08)}
.meter{flex:1;min-width:160px;height:14px;background:var(--line);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--k);transition:width .1s}

/* steps */
.step{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--bg);border-radius:22px;padding:18px}
.step .g{font-size:84px;line-height:1}
.step p{margin:0;font-size:21px;font-weight:700}
.step .cnt{font-family:var(--f-display);color:var(--muted);font-size:14px;font-weight:700}
.pend{display:inline-block;animation:swing 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes swing{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.hint-tgl{border:0;background:none;color:var(--muted);font-weight:800;text-decoration:underline;padding:0}

/* sort / order / match */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:80px}
.chipitem{border:3px solid var(--line);background:var(--paper);border-radius:18px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;min-width:84px}
.chipitem .g{font-size:42px;line-height:1.1}
.chipitem.sel{border-color:var(--k);transform:translateY(-3px);box-shadow:var(--shadow)}
.chipitem.no{animation:nudge .45s}
.chipitem.paired{border-color:var(--ok)}
.baskets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.basket{border:3px dashed var(--line);border-radius:22px;padding:12px;min-height:130px;background:var(--bg);display:flex;flex-direction:column;gap:8px;text-align:left}
.basket h5{margin:0;font-family:var(--f-display);font-size:17px;display:flex;gap:8px;align-items:center}
.basket h5 .g{font-size:28px}
.basket .in{display:flex;flex-wrap:wrap;gap:6px;font-size:34px}
.basket.target{border-color:var(--k)}
.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.slot{width:110px;min-height:110px;border:3px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:50px;position:relative;background:var(--bg)}
.slot .ix{position:absolute;top:4px;left:10px;font-size:14px;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.slot small{font-size:13px;font-weight:800}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--paper)}
.wslots .slot{width:auto;min-width:96px;padding:12px 14px;font-size:20px;font-weight:800;min-height:70px}
.matchcols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.matchcols .col{display:flex;flex-direction:column;gap:10px}
.matchcols .chipitem{flex-direction:row;gap:10px;justify-content:flex-start;font-size:16px}

/* rhythm */
.beats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:12px}
.beats i{width:44px;height:44px;border-radius:50%;background:var(--line);transition:transform .1s, background .1s}
.beats i.gap{width:14px;background:transparent}
.beats i.lit{background:var(--sun);transform:scale(1.2)}
.beats i.fill{background:var(--k)}
.clap{font-size:56px;border:0;background:var(--bg);border-radius:50%;width:132px;height:132px;align-self:center;box-shadow:var(--shadow)}
.clap:active{transform:scale(.94)}
.sylls{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;font-family:var(--f-display);font-size:clamp(28px,5vw,44px);font-weight:800}
.sylls span{padding:4px 10px;border-radius:12px;transition:background .2s}
.sylls span.lit{background:var(--sun);color:var(--sun-ink)}
.sylls .sp{width:18px;padding:0}

/* scene */
.scene{position:relative;aspect-ratio:16/9;width:min(100%,760px);margin-inline:auto;border-radius:22px;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--c1) 30%,var(--paper)) 55%, color-mix(in srgb,var(--c4) 40%,var(--paper)) 55%)}
.scene .it{position:absolute;border:0;background:none;padding:0;line-height:1;transform:translate(-50%,-50%)}
.scene .it.found{filter:drop-shadow(0 0 0 var(--ok));outline:3px solid var(--ok);border-radius:14px}
.scene .it.no{animation:nudge .45s}
.tree{display:inline-block;transform-origin:50% 100%}
.tree.soft{animation:sway 3s ease-in-out infinite}
.tree.hard{animation:sway2 .9s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
@keyframes sway2{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(16deg)}}

/* chest */
.chest{border:0;background:none;font-size:110px;line-height:1;align-self:center;padding:0}
.chest.open{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.15)}}

/* dialog */
.bub2 .replay{margin-left:auto;align-self:center;font-size:16px;padding:4px 8px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;padding:4px}
.bub2{max-width:80%;padding:10px 14px;border-radius:18px;font-size:18px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.bub2 .who{font-size:32px;line-height:1}
.bub2.npc{background:var(--bg);align-self:flex-start;border-bottom-left-radius:6px}
.bub2.me{background:color-mix(in srgb,var(--k) 18%,var(--paper));align-self:flex-end;border-bottom-right-radius:6px}
.bub2 small{display:block;font-size:12px;color:var(--muted);font-weight:800}
.replies{display:flex;flex-direction:column;gap:8px}
.reply{border:2px solid var(--k);background:var(--paper);border-radius:16px;padding:10px 14px;text-align:left;font-weight:800;font-size:17px}
.reply.own{border-style:dashed;color:var(--muted)}

/* celebrate */
.celebrate{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 82%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.celebrate .card{background:var(--paper);border-radius:28px;padding:28px;max-width:440px;width:100%;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:center}
.celebrate .big{font-size:64px;letter-spacing:6px}
.celebrate h2{font-size:30px}
.celebrate .btn-row{justify-content:center}
.adult{margin-top:22px}
.adult h2{font-size:28px;margin-bottom:10px}
.adult section{background:var(--paper);border-radius:22px;padding:20px;margin-top:14px;box-shadow:var(--shadow)}
.adult section h3{font-size:20px;margin-bottom:8px}
.adult table{border-collapse:collapse;width:100%;font-size:15px}
.adult td,.adult th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tblwrap{overflow-x:auto}


/* camera + mic */
.cam{position:relative;border-radius:22px;overflow:hidden;background:#0d1a1a;aspect-ratio:4/3;width:min(100%,440px);align-self:center;transition:box-shadow .3s}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam.off video{display:none}
.cam .camst{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px}
.cam .hold{position:absolute;left:0;top:0;height:8px;width:0;background:var(--ok);transition:width .1s}
.cam.okflash{box-shadow:0 0 0 5px var(--ok)}
.stepctl{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.mic{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:18px;padding:14px;align-self:stretch}
.microw{display:flex;gap:14px;align-items:center}
.micbtn{width:76px;height:76px;border-radius:50%;border:0;background:var(--k);color:#fff;font-size:34px;flex:none;box-shadow:var(--shadow)}
.micbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--k) 60%,transparent)}100%{box-shadow:0 0 0 20px transparent}}
.micst{font-weight:800}
.heard{color:var(--muted);font-size:16px;overflow-wrap:anywhere}
.opt.sel{border-color:var(--k);box-shadow:var(--shadow)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .letters{max-width:420px;width:100%;justify-self:center}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .path{grid-template-columns:1fr}
  .lvls{grid-template-columns:1fr}
  .lvl{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
  .task{padding:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step{grid-template-columns:1fr;text-align:center}
  .matchcols{gap:10px}
  .top nav{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home"><span class="dot">Ә</span>Еркін сөйлеу әлемі</a>
    <nav>
      <a href="#home" data-nav="home">Басты бет</a>
      <a href="#prep1" data-nav="prep">Дайындық</a>
      <a href="#games" data-nav="games">30 ойын</a>
      <a href="#adults" data-nav="adults">Ересектерге</a>
    </nav>
  </header>

        : 'Микрофонға рұқсат жоқ. Мекенжай жолағындағы белгіні басып, микрофонды рұқсат етіңіз, сосын бетті жаңартыңыз.';
      else if(er==='service-not-allowed'||er==='language-not-supported') st.textContent= IOS
        ? 'Дауысты тану өшірулі. iPhone-да: Баптаулар → Жалпы → Пернетақта → «Диктовканы қосу» қосыңыз, сосын бетті жаңартыңыз.'
        : 'Бұл браузерде дауысты тану жұмыс істемейді. Chrome-да ашыңыз.';
      else { st.textContent='Дауысты тану қатесі ('+er+'). 🎤 Тағы басып көріңіз.'; blocked=false; }
    };
    r.onend=()=>{
      clearTimeout(silence); clearTimeout(hardStop); SR_LAST_END=performance.now();
      if(SR_CUR===r) SR_CUR=null; const mine=rec===r; if(mine) rec=null;
      btn.classList.remove('on'); doneB.hidden=true;
      if(passed||blocked||!mine) return;
      const text=current();
      if(text && o.check(text)){ heard.textContent='Естігенім: «'+text+'»'; pass(text); return; }
      if(handled) return;
      if(text) heard.textContent='Естігенім: «'+text+'»';
      fail(text);
    };
    try{ r.start(); }
    catch(e){ rec=null; if(SR_CUR===r) SR_CUR=null; st.textContent='🎤 Микрофонды басып, сөйле.'; if(!fromTap) setTimeout(()=>start(false),400); }
  }
  btn.onclick=()=>{ if(rec){ doneB.click(); return; } start(true); };
  box.start=()=>start(true);
  if(o.startNow) Promise.resolve().then(()=>start(true));   // same tap, after the panel is on the page
  else if(o.auto!==false&&!IOS) setTimeout(()=>start(false),o.delay||500);
  return box;
}

let VO=null, VO_UNLOCKED=false;
function voiceEl(){ if(!VO){ VO=new Audio(); VO.preload='auto'; } return VO; }
document.addEventListener('pointerdown',()=>{ if(VO_UNLOCKED) return; VO_UNLOCKED=true;
  const a=voiceEl(); if(a.src) return; a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA='; a.play().catch(()=>{}); },{capture:true});
function playVoice(name,text){
  return new Promise(res=>{
    const f=VOICES[name+'|'+text];
    if(!f){ speak(text); return setTimeout(res,600); }
    stopListening();
    const a=voiceEl(); let doneV=false; const fin=()=>{ if(doneV) return; doneV=true; a.onended=a.onerror=null; res(); };
    a.onended=fin; a.onerror=fin; a.src='sounds/voice/'+f+'.mp3';

/* =========================================================
   FRONT CAMERA + FACE TRACKING (MediaPipe Face Landmarker)
   ========================================================= */
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
let FLP=null;
function getLandmarker(){
  if(!FLP) FLP=(async()=>{
    const v=await import(MP+'/vision_bundle.mjs');
    const fs=await v.FilesetResolver.forVisionTasks(MP+'/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},outputFaceBlendshapes:true,runningMode:'VIDEO',numFaces:1});
    try{ return await v.FaceLandmarker.createFromOptions(fs,opts('GPU')); }catch(e){ return await v.FaceLandmarker.createFromOptions(fs,opts('CPU')); }
  })().catch(e=>{ FLP=null; throw e; });
  return FLP;
}
const avg=(b,x,y)=>((b[x]||0)+(b[y]||0))/2;
const DET={
  smile:  b=>avg(b,'mouthSmileLeft','mouthSmileRight')>.45,
  pucker: b=>(b.mouthPucker||0)>.45||(b.mouthFunnel||0)>.35,
  open:   b=>(b.jawOpen||0)>.22,
  yawn:   b=>(b.jawOpen||0)>.5,
  relax:  b=>(b.jawOpen||0)<.15&&avg(b,'mouthSmileLeft','mouthSmileRight')<.25&&(b.mouthPucker||0)<.3,
  side:   b=>Math.max(b.mouthLeft||0,b.mouthRight||0)>.2,
  sad:    b=>avg(b,'mouthFrownLeft','mouthFrownRight')>.2||((b.browInnerUp||0)>.4&&avg(b,'mouthSmileLeft','mouthSmileRight')<.15),
  surprise:b=>(b.jawOpen||0)>.2&&((b.browInnerUp||0)>.3||avg(b,'eyeWideLeft','eyeWideRight')>.25),
  angry:  b=>avg(b,'browDownLeft','browDownRight')>.3,
};
const DET_HELP={smile:'кең күлімдеуді',pucker:'ерінді алға созуды',open:'ауыздың ашылуын',yawn:'ауызды кең ашуды',relax:'ерінді босатуды',side:'ауыз бұрышының қимылын',sad:'мұңды бетті',surprise:'таңданған бетті',angry:'ашулы бетті'};

function camView(){
  const video=h('video',{playsinline:true,muted:true,autoplay:true});
  video.muted=true;
  const st=h('div',{class:'camst'},'📷 Алдыңғы камераға рұқсат беріңіз...');
  const bar=h('div',{class:'hold'});
  const el=h('div',{class:'cam'},video,bar,st);
  const api={el, ready:false, tracking:false, failed:false, watching:null};
  let stream=null, fl=null, lastTs=0;
  (async()=>{
    try{
      if(!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
      if(!el.isConnected){ stream.getTracks().forEach(x=>x.stop()); return; }
      captureOn(); video.srcObject=stream; await video.play().catch(()=>{});
      api.ready=true; st.textContent='Камера дайын. Бет-қимылды тану жүктелуде...';
      try{ fl=await getLandmarker(); api.tracking=true; st.textContent='Бетіңді камераға көрсет 🙂'; }
      catch(e){ st.textContent='Бет-қимылды тану жүктелмеді (интернетті тексеріңіз). Камераны айна ретінде қолданыңыз.'; api.failed=true; api.onFail&&api.onFail(); }
    }catch(e){ api.failed=true; el.classList.add('off'); st.textContent='📷 Камера қосылмады. Камераға рұқсат беріңіз немесе айнаның алдында жасаңыз.'; api.onFail&&api.onFail(); }
  })();
  let hold=0, armed=true, prevOk=false, lastT=performance.now();
  const loop=now=>{
    if(!el.isConnected){ if(stream){ stream.getTracks().forEach(x=>x.stop()); stream=null; captureOff(); } return; }
    const dt=Math.min(.1,(now-lastT)/1000); lastT=now;
    if(fl&&api.ready&&video.readyState>=2&&now>lastTs){
      lastTs=now;
      let r=null; try{ r=fl.detectForVideo(video,now); }catch(e){}
      const cats=r&&r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories;
      const w=api.watching;
      if(!cats){ hold=0; bar.style.width='0'; if(w) st.textContent='Бетіңді камераға көрсет 🙂'; }
      else if(w){
        const b={}; cats.forEach(c=>b[c.categoryName]=c.score);
        const ok=DET[w.chk](b);
        if(!ok) armed=true;
        if(ok&&armed){ hold+=dt; st.textContent='Жарайсың, солай ұста...'; } else { hold=Math.max(0,hold-dt*2); st.textContent='Камера '+DET_HELP[w.chk]+' күтіп тұр 👀'; }
        bar.style.width=Math.min(100,hold/0.7*100)+'%';
        if(hold>=0.7){ const cb=w.cb; api.watching=null; hold=0; bar.style.width='0'; el.classList.add('okflash'); setTimeout(()=>el.classList.remove('okflash'),600); st.textContent='✓ Дұрыс!'; cb(); }
      } else st.textContent='Бетің көрініп тұр 🙂';
    }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  /* watch(chk, cb): fires cb once the expression is held; `fresh` = must change from the previous pose first */
  api.watch=(chk,cb,fresh)=>{ hold=0; armed=!fresh; api.watching={chk,cb}; };
  api.unwatch=()=>{ api.watching=null; };
  return api;
}

R.breath=(t,root,done)=>{
  root.append(qline(t.q));
  const st=h('div',{class:'stage'}); root.append(st);
  let prog=0, holding=false, held=0, finished=false; const N=t.steps; const PER=1.3; // seconds of gentle blowing per step
  let actor, extra=[];
  const sc=t.scene;
  if(sc==='butterfly'){ ['🌼','🌷','🌻'].forEach((f,i)=>{ const p=h('span',{class:'prop',style:`left:${12+(i+1)*(70/N)}%;bottom:18px`},f); st.append(p); extra.push(p); }); st.append(h('span',{class:'prop',style:'left:4%;bottom:18px'},'🌸')); actor=h('span',{class:'actor',style:'left:4%;top:60px'},'🦋'); }
  if(sc==='leaf'){ st.append(h('span',{class:'prop',style:'left:2%;bottom:0;font-size:100px'},'🌳')); actor=h('span',{class:'actor',style:'left:14%;top:70px'},glyph('leaf:#E0962A',54)); }

  if(sc==='balloon'){ actor=h('span',{class:'actor',style:'left:50%;bottom:20px;transform-origin:50% 100%'},glyph('balloon:#E04B3A',120)); }
  if(sc==='candle'){ const row=h('div',{style:'position:absolute;inset:auto 0 24px 0;display:flex;justify-content:center;gap:40px'}); for(let i=0;i<N;i++){ const c=h('div',{style:'display:flex;flex-direction:column;align-items:center'},h('span',{class:'flame',style:'font-size:40px'},'🔥'),h('span',{style:'display:block;width:22px;height:70px;border-radius:6px;background:#F5E6C8;border:2px solid #D9C49A'})); row.append(c); extra.push(c.firstChild); } st.append(row); }
  if(sc==='bubbles'){ actor=h('span',{class:'actor',style:'left:10%;bottom:20px;font-size:70px'},'🫧'); }
  if(actor) st.append(actor);

  const meter=h('div',{class:'meter'},h('i',{})); const msg=h('div',{class:'msg kind'},'Батырманы басып тұрып, ақырын үрле. Жіберсең — демаласың.');
  const blow=h('button',{class:'blow'},'🌬️ Үрлеу (басып тұр)');
  const mic=h('button',{class:'btn ghost'},'🎤 Микрофонмен');
  root.append(h('div',{class:'blowbar'},blow,meter,mic),msg);

  const setBlow=v=>{ if(finished) return; holding=v; blow.classList.toggle('on',v); if(!v){ held=0; if(!finished) msg.textContent='Демал 🙂 Мұрынмен тыныс ал.'; } else msg.textContent='Ақырын... бірқалыпты...'; };
  blow.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); setBlow(true); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>blow.addEventListener(ev,()=>setBlow(false)));
  blow.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&!e.repeat){ e.preventDefault(); setBlow(true);} });
  blow.addEventListener('keyup',e=>{ if(e.key===' '||e.key==='Enter') setBlow(false); });

  let micOn=false, analyser=null, buf=null, stream=null;
  mic.onclick=async()=>{
    if(micOn) return;
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); captureOn(); const c=ac(); const src=c.createMediaStreamSource(stream); analyser=c.createAnalyser(); analyser.fftSize=512; buf=new Uint8Array(analyser.fftSize); src.connect(analyser); micOn=true; mic.textContent='🎤 Микрофон қосулы'; msg.textContent='Микрофонға қарай ақырын үрле.'; }

    if(sc==='leaf'&&actor) actor.style.transform=`translate(${prog*(W*.75)}px,${Math.sin(prog*12)*30+(blowing?-6:0)}px) rotate(${prog*540}deg)`;
    if(sc==='boat'&&actor) actor.style.transform=`translate(${prog*(W*.72)}px,${Math.sin(now/400)*4}px) rotate(${Math.sin(now/500)*4}deg)`;
    if(sc==='balloon'&&actor) actor.style.transform=`translateX(-50%) scale(${.45+prog*1.0})`;
    if(sc==='candle'){ const out=Math.floor(prog*N+1e-6); extra.forEach((f,i)=>{ if(i<out){ f.style.opacity=0; } else { f.style.opacity=1; f.style.transform= blowing&&i===out? `skewX(${Math.sin(now/60)*18}deg) scaleY(.8)` : ''; } }); }
    if(sc==='bubbles'&&blowing&&!finished){ bubT+=dt; if(bubT>.18){ bubT=0; const s=16+Math.random()*30; const b=h('span',{class:'bub',style:`width:${s}px;height:${s}px;left:${18+Math.random()*8}%;bottom:${50+Math.random()*30}px;--dx:${60+Math.random()*W*.6}px`}); st.append(b); setTimeout(()=>b.remove(),3300); } }
    if(prog>=1&&!finished){ finished=true; holding=false; blow.classList.remove('on'); blow.disabled=true; msg.className='msg good'; msg.textContent=pick(PRAISE)+' Сен өте жақсы үрледің!'; if(stream){ stream.getTracks().forEach(x=>x.stop()); stream=null; captureOff(); } play('yay'); done(); }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
};

R.steps=(t,root,done)=>{
  root.append(qline(t.q));
  const cam=t.cam?camView():null;
  if(cam) root.append(cam.el);
  let i=0, prevChk=null; const box=h('div'); const ctl=h('div',{class:'stepctl'});
  const sndB=t.snd?h('button',{class:'btn',onclick:()=>play(t.snd)},'🔊 Дыбысын тыңда'):null;
  let skipTimer=null;
  const finishStep=()=>{ clearTimeout(skipTimer); cam&&cam.unwatch(); play('tick'); i++; if(i<t.items.length) draw(); else { ctl.replaceChildren(h('div',{class:'msg good'},'⭐ '+pick(PRAISE)+' Бәрін орындадың!')); play('yay'); done(); } };
  const manual=label=>{ const b=h('button',{class:'btn primary'},label||'✓ Жасадым'); b.onclick=()=>{ b.disabled=true; finishStep(); }; return b; };
  const draw=()=>{
    const [g,txt,chk]=t.items[i]; const [main,hint]=txt.split('|');
    const gl=glyph(g,84); if(t.anim==='pend' && g==='🕰️') gl.classList.add('pend');
    const p=h('div',{},h('div',{class:'cnt'},`${i+1} / ${t.items.length}`),h('p',{},main));
    if(hint){ const hb=h('div',{class:'help',hidden:true},'Былай сұрауға болады: ',h('b',{},hint)); const tg=h('button',{class:'hint-tgl',onclick:()=>{hb.hidden=!hb.hidden}},'💡 Қалай айтамыз?'); p.append(tg,hb); }
    box.replaceChildren(h('div',{class:'step'},gl,p));
    ctl.replaceChildren(); if(sndB) ctl.append(h('div',{class:'btn-row'},sndB));
    clearTimeout(skipTimer);
    if(chk&&chk.startsWith('say:')){
      const exp=chk.slice(4);
      ctl.append(micPanel({check:x=>phraseScore(x,exp)>=.6,onPass:()=>setTimeout(finishStep,900)}));
    } else if(chk&&cam&&!cam.failed){
      const note=h('div',{class:'msg kind'},'');
      const sk=h('button',{class:'hint-tgl',hidden:true},'Ересек: келесіге өту →'); sk.onclick=finishStep;
      ctl.append(note,sk);
      cam.watch(chk,()=>{ note.className='msg good'; note.textContent=pick(PRAISE); setTimeout(finishStep,700); }, chk===prevChk);
      cam.onFail=()=>{ ctl.replaceChildren(manual()); };
      skipTimer=setTimeout(()=>{ if(!ctl.isConnected) return; note.textContent='Қайтадан байқап көр 🙂 Бетің камераға толық көрініп тұрсын.'; sk.hidden=false; },12000);
    } else {
      if(cam) cam.onFail=null;
      ctl.append(manual(), chk||!cam? null : h('div',{class:'tip'},'👀 Бұл қимылды камера көрмейді — ересек адам бақылап, батырманы бассын.'));
    }
    prevChk=chk||null;
  };
  draw(); root.append(box,ctl);
  if(!cam) root.append(h('p',{class:'tip'},'🪞 Айнаның алдында жасаған ыңғайлы. Асықпа.'));
};

  const plain=t.text.replace(/-/g,'').replace(/—/g,' ');

  go.onclick=()=>{ if(running) return; running=true; ac();
    if(!micBox.firstChild) micBox.append(micPanel({delay:0,check:x=>phraseScore(x,plain)>=.5,onPass:()=>{ msg.className='msg good'; msg.textContent=pick(PRAISE)+' Бірқалыпты, әдемі айттың!'; done(); }}));

R.dialog=(t,root,done)=>{

    const body=h('div',{},name?h('small',{},name):null,text);

  let left=t.items.length; const msg=h('div',{class:'msg kind'},'Суретті бас, сосын оның атын дауыстап айт 🎤');

    cards.forEach(x=>x.b.classList.remove('sel')); c.b.classList.add('sel');

  };

};

/* one board for both preparation stages and games */
function board(kind,id,lv){
  const isPrep=kind==='prep';
  const item=isPrep?PREP.find(p=>p.id===id):GAMES.find(g=>g.id===id);
  if(!item){ location.hash='#home'; return; }
  const k=isPrep?item.k:SECTIONS[item.sec].k;
  const key=(isPrep?'p':'g')+id;
  lv=Math.max(0,Math.min(2,lv|0));
  const levels=item.levels[lv]; let ti=0;
  const root=h('div',{style:`--k:var(${k})`});
  const head=h('div',{class:'board-h'},
    h('a',{class:'back',href:isPrep?'#home':'#games'},'← '+(isPrep?'Басты бет':'Барлық ойындар')),
    h('span',{class:'chip'},isPrep?id+'-кезең · Дайындық':id+'-ойын · '+SECTIONS[item.sec].short),
    h('h1',{},isPrep?item.title:item.title));
  if(isPrep) head.append(h('p',{class:'muted',style:'margin:0;flex-basis:100%'},'Мақсаты: '+item.goal));
  const tabs=h('div',{class:'lvls'},[0,1,2].map(i=>h('button',{class:'lvl','aria-pressed':i===lv,onclick:()=>go(kind,id,i)},
    h('b',{},isPrep?item.names[i]:LVL[i].n, has(key+'-'+(i+1))?h('span',{class:'done'},' ⭐'):null),
    h('small',{},isPrep?['Бастапқы','Жалғастыру','Жетілдіру'][i]:LVL[i].s))));
  const goal=isPrep?null:h('div',{class:'goal'},h('b',{},'Тапсырма:'),h('span',{},item.d[lv]));
  const dots=h('div',{class:'dots','aria-hidden':'true'});
  const taskEl=h('div',{class:'task'});
  root.append(head,tabs); if(goal) root.append(goal); root.append(dots,taskEl);
  app.replaceChildren(root);

  const drawDots=()=>{ dots.replaceChildren(...levels.map((_,i)=>h('i',{class:i<ti?'on':i===ti?'cur':''}))); };
  const runTask=()=>{
    stopListening();
    drawDots();
    const t=levels[ti]; const inner=h('div',{style:'display:flex;flex-direction:column;gap:16px'});
    taskEl.replaceChildren(inner);
    let fired=false;
    R[t.t](t,inner,()=>{
      if(fired) return; fired=true;
      const last=ti===levels.length-1;
      const nb=h('button',{class:'btn primary next'},last?'Деңгейді аяқтау ⭐':'Келесі тапсырма →');
      nb.onclick=()=>{ if(last){ finishLevel(); } else { ti++; runTask(); } };
      taskEl.append(nb); nb.focus({preventScroll:true});
    });
  };
  const finishLevel=()=>{
    mark(key+'-'+(lv+1)); ti=levels.length; drawDots(); play('yay');
    const list=isPrep?PREP:GAMES; const idx=list.indexOf(item);
    const nxt=list[idx+1];
    const btns=h('div',{class:'btn-row'});
    if(lv<2) btns.append(h('button',{class:'btn primary',onclick:()=>{ ov.remove(); go(kind,id,lv+1); }},'Келесі деңгей →'));
    else if(nxt) btns.append(h('button',{class:'btn primary',onclick:()=>{ ov.remove(); go(kind,nxt.id,0); }},isPrep?'Келесі кезең →':'Келесі ойын →'));
    else if(isPrep) btns.append(h('button',{class:'btn primary',onclick:()=>{ ov.remove(); go('game',1,0); }},'30 ойынды бастау →'));
    btns.append(h('button',{class:'btn',onclick:()=>{ ov.remove(); location.hash=isPrep?'#home':'#games'; }},isPrep?'Басты бет':'Ойындар тізімі'));
    const ov=h('div',{class:'celebrate',role:'dialog','aria-modal':'true'},h('div',{class:'card'},
      h('div',{class:'big'},'⭐'.repeat(1)),
      h('h2',{},pick(PRAISE)),
      h('p',{class:'muted',style:'margin:0'},(isPrep?item.names[lv]:LVL[lv].n)+' аяқталды. Жұлдыз жинадың!'),
      starsFor(key), btns));
    document.body.append(ov); ov.querySelector('.btn').focus();
  };
  runTask();
  window.scrollTo({top:0});
}

function go(kind,id,lv){ const hsh=`#${kind}${id}${lv?'-l'+(lv+1):''}`; if(location.hash===hsh) route(); else location.hash=hsh; }

function route(){
  stopListening();
  document.querySelectorAll('.celebrate').forEach(x=>x.remove());
  const hs=location.hash.slice(1)||'home';
  let m;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.remove('on'));
  const nav=n=>document.querySelector(`[data-nav="${n}"]`)?.classList.add('on');
  if((m=hs.match(/^(prep|game)(\d+)(?:-l([123]))?$/))){ nav(m[1]==='prep'?'prep':'games'); board(m[1],+m[2],m[3]?(+m[3]-1):0); return; }
  if(hs==='adults'){ nav('adults'); adults(); window.scrollTo({top:0}); return; }
  if(hs==='games'){ nav('games'); home(); requestAnimationFrame(()=>document.getElementById('games')?.scrollIntoView()); return; }
  nav('home'); home(); window.scrollTo({top:0});
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopListening(); });
route();
</script>
